<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JANUS - Security & Network Operations System</title>

    <!-- Local Bootstrap  /var/www/janus/assets/) -->
    <link href="assets/bootstrap.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===================================================
           JANUS Login Page — Midnight Violet Design System
           Background : #301934
           Surface    : #3d2248
           Accent     : #B284BE (Amethyst Smoke)
           Text       : #FFF0F5 (Lavender Blush)
        =================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(
          160deg,
          #1a0b22 0%,
          #28112f 40%,
          #301934 70%,
          #3a1f40 100%
        );
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Lato", sans-serif;
        font-size: 0.95rem;
        color: #fff0f5;
        -webkit-font-smoothing: antialiased;
      }

      /* --- Login Card --- */
      .login-container {
        position: relative;
        background: #3d2248;
        border: 1px solid rgba(178, 132, 190, 0.22);
        border-radius: 16px; /* Section 5: primary component */
        padding: 44px 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        /* Spec: NO box-shadow, NO glow */
      }

      /* --- Icon circle --- */
      .icon-circle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(178, 132, 190, 0.18);
        border: 1px solid rgba(178, 132, 190, 0.35);
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 22px;
      }

      .janus-icon {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      /* --- Header --- */
      .login-header h1 {
        font-size: 1.9rem;
        font-weight: 700;
        color: #b284be;
        margin-bottom: 6px;
        /* Spec: NO gradient clip text */
      }

      .login-header p {
        font-size: 0.875rem;
        color: rgba(255, 240, 245, 0.55);
        margin-bottom: 28px;
        font-weight: 300;
      }

      /* --- Inputs --- */
      .input-group {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 16px;
        margin-bottom: 16px;
        overflow: hidden;
        border: 1px solid rgba(178, 132, 190, 0.15);
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease;
      }

      .input-group:focus-within {
        border-color: #b284be;
        background: rgba(0, 0, 0, 0.25);
      }

      .input-group .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
      }

      .form-control {
        background: transparent;
        border: none;
        color: #fff0f5;
        padding: 14px 14px 14px 0;
        font-family: "Lato", sans-serif;
        font-size: 0.95rem;
        width: 100%;
      }

      .form-control::placeholder {
        color: rgba(255, 240, 245, 0.4);
      }

      .form-control:focus {
        box-shadow: none;
        outline: none;
        color: #fff0f5;
        background-color: transparent;
      }

      /* Prevent browser autofill from turning the input background white */
      .form-control:-webkit-autofill,
      .form-control:-webkit-autofill:hover,
      .form-control:-webkit-autofill:focus,
      .form-control:-webkit-autofill:active {
        -webkit-text-fill-color: #fff0f5 !important;
        transition: background-color 5000s ease-in-out 0s;
        caret-color: #fff0f5;
      }
      .toggle-password {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.2s ease;
      }

      .toggle-password:hover {
        opacity: 1;
      }

      /* --- Button --- */
      .btn-login {
        background: #b284be;
        border: none;
        border-radius: 16px;
        padding: 14px;
        width: 100%;
        font-family: "Lato", sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        color: #301934;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
        margin-top: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .btn-login:hover {
        background-color: #c49ecf;
      }

      /* --- Error message --- */
      .alert-danger {
        background: rgba(248, 113, 113, 0.12);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #f87171;
        border-radius: 16px;
        padding: 10px 14px;
        font-size: 0.875rem;
        margin-bottom: 16px;
        text-align: left;
      }

      /* --- Footer --- */
      .footer-text {
        margin-top: 24px;
        font-size: 0.8rem;
        color: rgba(255, 240, 245, 0.3);
        font-weight: 300;
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 30px 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="icon-circle">
        <img src="images/Group 2.svg" alt="JanusIcon" class="janus-icon" />
      </div>

      <div class="login-header">
        <h1>JANUS</h1>
        <p>Security & Network Operations System</p>
      </div>

      <!-- Form: svg icons used inline so no external font required -->
      <form action="authenticate.php" method="post">
        <div class="input-group d-flex align-items-center">
          <div class="icon">
            <!-- User SVG -->
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                stroke="#B284BE"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M4 22C4 17.5817 7.58172 14 12 14C16.4183 14 20 17.5817 20 22"
                stroke="#B284BE"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Username"
            required
          />
        </div>

        <div class="input-group d-flex align-items-center">
          <div class="icon">
            <!-- Lock SVG -->
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="10"
                rx="2"
                stroke="#B284BE"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M7 11V8C7 5.79086 8.79086 4 11 4C13.2091 4 15 5.79086 15 8V11"
                stroke="#B284BE"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <input
            type="password"
            id="passwordInput"
            class="form-control"
            name="password"
            placeholder="Password"
            required
          />
          <div
            class="toggle-password"
            id="togglePassword"
            title="Toggle Password Visibility"
          >
            <!-- Eye open -->
            <svg
              class="eye-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#B284BE"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye closed -->
            <svg
              class="eye-off-icon"
              style="display: none"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#B284BE"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn btn-login">
          <!-- Sign-in SVG + label -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M15 3H21V9"
              stroke="#301934"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M10 14L21 3"
              stroke="#301934"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M21 21H3V3"
              stroke="#301934"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Login</span>
        </button>
      </form>

      <div class="footer-text">
        <p>Version 1.2 Beta</p>
      </div>
    </div>

    <!-- local bootstrap JS -->
    <script src="assets/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("togglePassword")
        .addEventListener("click", function () {
          const passwordInput = document.getElementById("passwordInput");
          const eyeIcon = this.querySelector(".eye-icon");
          const eyeOffIcon = this.querySelector(".eye-off-icon");

          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.style.display = "none";
            eyeOffIcon.style.display = "block";
          } else {
            passwordInput.type = "password";
            eyeIcon.style.display = "block";
            eyeOffIcon.style.display = "none";
          }
        });
    </script>
  </body>
</html>
