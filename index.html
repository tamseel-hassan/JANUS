<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="x-dns-prefetch-control" content="off">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JANUS - Security & Network Operations System</title>

    <!-- Local Bootstrap  /var/www/janus/assets/) -->
    <link href="assets/bootstrap.min.css" rel="stylesheet">

    <style>
        /* --- Background Animation --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* use local background image (lxVYkYV.png) */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("lxVYkYV.png") repeat;
            opacity: 0.05;
            animation: moveStars 100s linear infinite;
        }

        @keyframes moveStars {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 10000px 5000px;
            }
        }

        /* --- Login Container --- */
        .login-container {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header h1 {
            font-size: 2.4rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 25px;
        }

        /* --- Inputs --- */
        .input-group {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-group .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            background: rgba(0, 114, 255, 0.10);
        }

        .form-control {
            background: transparent;
            border: none;
            color: #fff;
            padding-left: 12px;
        }

        .form-control::placeholder {
            color: #bbb;
        }

        .form-control:focus {
            box-shadow: none;
            outline: none;
            color: #fff;
        }

        /* --- Button --- */
        .btn-login {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.4);
        }

        /* --- Footer --- */
        .footer-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* --- Icon Circle --- */
        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.5);
            overflow: hidden;
        }

        .janus-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        /* small responsive tweak */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="icon-circle">
            <img src="images/Group 2.svg" alt="JanusIcon" class="janus-icon">
        </div>

        <div class="login-header">
            <h1>JANUS</h1>
            <p>Security & Network Operations System</p>
        </div>

        <!-- Form: svg icons used inline so no external font required -->
        <form action="authenticate.php" method="post">
            <div class="input-group d-flex align-items-center">
                <div class="icon">
                    <!-- User SVG -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                            stroke="#00c6ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M4 22C4 17.5817 7.58172 14 12 14C16.4183 14 20 17.5817 20 22" stroke="#00c6ff"
                            stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <input type="text" class="form-control" name="username" placeholder="Username" required>
            </div>

            <div class="input-group d-flex align-items-center">
                <div class="icon">
                    <!-- Lock SVG -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <rect x="3" y="11" width="18" height="10" rx="2" stroke="#00c6ff" stroke-width="1.4"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M7 11V8C7 5.79086 8.79086 4 11 4C13.2091 4 15 5.79086 15 8V11" stroke="#00c6ff"
                            stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-login mt-2">
                <!-- Sign-in SVG + label -->
                <span style="display:inline-flex;align-items:center;gap:8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path d="M15 3H21V9" stroke="#fff" stroke-width="1.4" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M10 14L21 3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M21 21H3V3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Login</span>
                </span>
            </button>
        </form>

        <div class="footer-text">
            <p>Verion 1.2 Beta</p>
        </div>
    </div>

    <!-- local bootstrap JS -->
    <script src="assets/bootstrap.bundle.min.js"></script>
</body>

</html>
